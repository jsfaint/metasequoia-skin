# border = "rgba(255,255,255,.15)" # 外框
# handle = "#8E8CD8"               # 左侧拖动条；不写时取同主题的 accent
# divider = "rgba(255,255,255,.15)" # 分隔线
# icon = "#FFFFFF"                 # 图标字形
# hover = "rgba(255,255,255,.10)"  # 图标悬停底色
#
